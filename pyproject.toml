[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "py-metrology-gdt"
version = "0.1.0"
description = "NIST-validated GD&T and geometric fitting engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "click",
    "rich",
    "streamlit",
    "plotly",
]

[project.scripts]
gdt = "gdt_engine.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "E702"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true

[tool.setuptools.packages.find]
where = ["src"]
